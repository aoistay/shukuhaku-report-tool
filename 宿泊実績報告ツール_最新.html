* { box-sizing: border-box; margin: 0; padding: 0; }

async function handleFiles(fileList) {
  const statusEl = document.getElementById('fileStatus');
  const errorEl  = document.getElementById('fileError');
  const listEl   = document.getElementById('fileList');
  statusEl.textContent = '読み込み中...';
  errorEl.textContent  = '';
  listEl.textContent   = '';
  bookingData     = null;
  originalHeaders = null;

  try {
    const results = await Promise.all([...fileList].map(f => readOneFile(f)));
    const allParsed = results.flatMap(r => r.rows);

    if (allParsed.length === 0) {
      errorEl.textContent = 'データが読み込めませんでした。列を確認してください（D:チェックイン E:チェックアウト H:部屋番号 L:国籍 Q:ゲスト数）';
      statusEl.textContent = '';
      return;
    }

    // ヘッダーは最初のファイルのものを使用

    bookingData = allParsed;
    dropZone.classList.add('loaded');
    statusEl.textContent = `✓ ${fileList.length}ファイル  計${allParsed.length.toLocaleString()}件の予約を読み込みました`;

    errorEl.textContent = 'エラー: ' + err.message;
    statusEl.textContent = '';

function readOneFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb   = XLSX.read(e.target.result, { type: 'array', cellDates: true });
        const ws   = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });

        const headers = rows[0] ? rows[0].map(h => String(h ?? '')) : [];
        const parsed  = [];

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 5) continue;

          const checkin      = parseDate(row[3]);
          const checkout     = parseDate(row[4]);
          const propertyName = String(row[5]  ?? '').trim();
          const room         = String(row[7]  ?? '').trim();
          const nat          = String(row[11] ?? '').trim();
          const status       = String(row[13] ?? '').trim(); // N列: 状態
          const guests       = parseInt(row[16]) || 1;

          if (!checkin || !checkout) continue;
          if (checkout <= checkin) continue;
          if (!room && !propertyName) continue;
          if (status && status !== '確認済み') continue; // 確認済み以外は除外

          parsed.push({
            checkin, checkout, room, propertyName,
            nationality: nat, guests,
            _rawRow: row   // レポート生成用に元行を保持
          });
        }
        resolve({ headers, rows: parsed });
      } catch(err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('ファイル読み込みエラー'));
    reader.readAsArrayBuffer(file);
  });
}

// =====================================================================
// 日付ユーティリティ
// =====================================================================
function parseDate(val) {
  if (!val && val !== 0) return null;
  // Excelシリアル値
  if (typeof val === 'number') {
    try {
      const info = XLSX.SSF.parse_date_code(val);
      return new Date(info.y, info.m - 1, info.d);
    } catch(e) { return null; }
  }
  if (val instanceof Date) {
    return new Date(val.getFullYear(), val.getMonth(), val.getDate());
  }
  const s = String(val).trim();
  const m = s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  return null;
}

function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}

function dateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}/${m}/${day}`;
}

// =====================================================================
// 期間計算
// =====================================================================
function getPeriod(year, periodStr) {
  const [s, e] = periodStr.split('-').map(Number);
  const startDate = new Date(year, s - 1, 1);
  const endYear   = e < s ? year + 1 : year;
  const endDate   = new Date(endYear, e, 0); // 月末日
  const totalDays = Math.round((endDate - startDate) / 86400000) + 1;
  return { startDate, endDate, totalDays };
}

// =====================================================================
// 集計ロジック
// =====================================================================
function processRoom(rawBookings, period) {
  const { startDate, endDate } = period;
  const dayAfterEnd = addDays(endDate, 1);

  // 期間と重複する予約のみ + 期間内にクリップ
  const bookings = [];
  for (const b of rawBookings) {
    if (b.checkout <= startDate) continue;      // 期間前に終了
    if (b.checkin >= dayAfterEnd) continue;     // 期間後に開始

    const effStart = b.checkin < startDate ? startDate : b.checkin;
    const effEnd   = b.checkout > dayAfterEnd  ? dayAfterEnd  : b.checkout;
    const effNights = Math.round((effEnd - effStart) / 86400000);
    if (effNights <= 0) continue;

    bookings.push({ ...b, effStart, effEnd, effNights });
  }
  return bookings;
}

function getOccupiedDates(bookings) {
  const set = new Set();
  for (const b of bookings) {
    for (let d = new Date(b.effStart); d < b.effEnd; d = addDays(d, 1)) {
      set.add(dateStr(d));
    }
  }
  return [...set].sort();
}

function applyHalfRule(bookings, totalDays) {
  const maxOccupied = Math.floor(totalDays / 2);
  let current = [...bookings];
  let occupied = getOccupiedDates(current).length;

  if (occupied <= maxOccupied) return { kept: current, removed: [] };

  // チェックイン日が遅い順（新しい予約）から削除
  const sorted = [...bookings].sort((a, b) => b.checkin - a.checkin);
  const removed = [];

  for (const candidate of sorted) {
    if (occupied <= maxOccupied) break;
    current = current.filter(b => b !== candidate);
    removed.push(candidate);
    occupied = getOccupiedDates(current).length;
  }

  return { kept: current, removed };
}

function mapNat(nat) {
  // ノーブレークスペース等の特殊空白を通常スペースに統一してから照合
  const key = nat.replace(/[  -​ 　]/g, ' ').toLowerCase().trim();
  return NAT_MAP[key] || 'その他';
}

// =====================================================================
// レポートCSV生成（UTF-8 BOM）
// =====================================================================
function buildReportCSV(allRoomBookings, keptSet, period) {
  const { startDate, endDate } = period;
  const dayAfterEnd = addDays(endDate, 1);

  // ヘッダー行: 元の列 + ステータス列
  const headers = originalHeaders || [];
  const headerRow = [...headers, '報告ステータス'].join(',');

  const dataRows = allRoomBookings.map(b => {
    // 期間との重複チェック
    const overlaps = b.checkout > startDate && b.checkin < dayAfterEnd;
    let status;
    if (!overlaps) {
      status = '対象外（期間外）';
    } else if (keptSet.has(b._rawRow)) {
      // 期間内クリップが発生しているか
      const clipped = b.checkin < startDate || b.checkout > dayAfterEnd;
      status = clipped ? '報告対象（日付修正あり）' : '報告対象';
    } else {
      status = '対象外（半分ルール）';
    }

    // 元行の各セルをCSV安全な文字列に変換
    const raw = b._rawRow || [];
    const cells = headers.map((_, i) => {
      const v = String(raw[i] ?? '');
      return v.includes(',') || v.includes('"') || v.includes('\n')
        ? `"${v.replace(/"/g, '""')}"` : v;
    });
    cells.push(status);
    return cells.join(',');
  });

  // UTF-8 BOM + ヘッダー + データ行
  const text = '﻿' + headerRow + '\r\n' + dataRows.join('\r\n') + '\r\n';
  return new TextEncoder().encode(text);
}

// =====================================================================
// CSV生成（Shift-JIS）
// =====================================================================
function buildCSVBytes(permitNum, periodId, bookings) {
  const dates      = getOccupiedDates(bookings);
  const stayDays   = dates.length;
  const guestCount = bookings.reduce((s, b) => s + b.guests, 0); // 実宿泊者数（人数合計）
  const totalPersonNights = bookings.reduce((s, b) => s + b.effNights * b.guests, 0);

  // 国籍集計（予約件数ベース）
  const natCount = {};
  NAT_COLS.forEach(n => natCount[n] = 0);
  for (const b of bookings) {
    const n = mapNat(b.nationality);
    natCount[n] = (natCount[n] || 0) + b.guests; // ゲスト人数分カウント
  }

  // データ行（ASCII文字のみ）
  const dataValues = [
    permitNum,
    periodId,
    stayDays,
    guestCount,
    Math.round(totalPersonNights),
    ...NAT_COLS.map(n => natCount[n] || 0),
    ...dates
  ];
  const dataRow = dataValues.join(',');

  // ヘッダー行: ヘッダー + 宿泊日数分の空列（データ行に合わせる）
  const trailingCommas = ','.repeat(dates.length);

  // バイト列を組み立て
  // ヘッダー行: Shift-JIS固定バイト + trailing commas + \r\n
  // データ行: ASCII（そのままUint8Arrayへ）
  const headerTrailing = (trailingCommas + '\r\n').split('').map(c => c.charCodeAt(0));
  const dataBytes      = (dataRow + '\r\n').split('').map(c => c.charCodeAt(0));

  const total = HEADER_SJIS.length + headerTrailing.length + dataBytes.length;
  const buf   = new Uint8Array(total);
  let pos = 0;
  buf.set(HEADER_SJIS, pos); pos += HEADER_SJIS.length;
  buf.set(headerTrailing, pos); pos += headerTrailing.length;
  buf.set(dataBytes, pos);

  return buf;
}

// =====================================================================
// メイン処理
// =====================================================================
async function generate() {
  const errorEl = document.getElementById('fileError');
  errorEl.textContent = '';

  if (!bookingData) {
    errorEl.textContent = 'まず予約データをアップロードしてください。';
    return;
  }

  const year      = parseInt(document.getElementById('yearInput').value);
  const periodStr = document.getElementById('periodSelect').value;
  const reduce    = currentOption === 'reduce';

  const period = getPeriod(year, periodStr);
  const periodId = `${year}_${periodStr}`;

  // ① 部屋番号ベース（新馬場）の集計
  const roomBookings = {};
  // ② 物件名ベース（一戸建て）の集計
  const propBookings = {};  // key: PROPERTY_PERMIT_MAP のname

  for (const b of bookingData) {
    const room = String(b.room).trim();
    if (room) {
      // H列に値がある → 部屋番号で識別
      if (!ROOM_PERMIT_MAP[room]) continue;
      if (!roomBookings[room]) roomBookings[room] = [];
      roomBookings[room].push(b);
    } else {
      // H列が空 → F列（物件名）で識別
      const pname = String(b.propertyName ?? '').toLowerCase();
      const matched = PROPERTY_PERMIT_MAP.find(p => pname.includes(p.keyword));
      if (!matched) continue;
      if (!propBookings[matched.name]) propBookings[matched.name] = [];
      propBookings[matched.name].push(b);
    }
  }

  const zip = new JSZip();
  const results = [];

  // ── 新馬場（部屋番号ベース）──
  for (const room of Object.keys(ROOM_PERMIT_MAP).sort()) {
    const permit   = ROOM_PERMIT_MAP[room];
    const rawList  = roomBookings[room] || [];
    const clipped  = processRoom(rawList, period);

    if (clipped.length === 0) {
      results.push({ label: `新馬場${room}`, permit, status: 'nodata', kept: 0, removed: 0, days: 0, maxDays: Math.floor(period.totalDays / 2) });
      continue;
    }

    let kept = clipped, removed = [];
    if (reduce) {
      const res = applyHalfRule(clipped, period.totalDays);
      kept = res.kept;
      removed = res.removed;
    }

    const occupiedDays = getOccupiedDates(kept).length;
    const csvBytes = buildCSVBytes(permit, periodId, kept);
    const filename = `新馬場${room}_${periodId}.csv`;
    zip.file(filename, csvBytes);

    // レポートCSV（全予約 + ステータス列）
    // _rawRow参照で照合（processRoomがspreadで新オブジェクトを作るため）
    const allForRoom = bookingData.filter(b => String(b.room).trim() === room);
    const keptRawRows = new Set(kept.map(b => b._rawRow));
    zip.file(`新馬場${room}_${periodId}_レポート.csv`,
      buildReportCSV(allForRoom, keptRawRows, period));

    results.push({
      label: `新馬場${room}`, permit, status: removed.length > 0 ? 'reduced' : 'ok',
      kept: kept.length, removed: removed.length,
      days: occupiedDays, maxDays: Math.floor(period.totalDays / 2)
    });
  }

  // ── 一戸建て物件（物件名ベース）──
  for (const prop of PROPERTY_PERMIT_MAP) {
    const rawList = propBookings[prop.name] || [];
    const clipped = processRoom(rawList, period);

    if (clipped.length === 0) {
      results.push({ label: prop.name, permit: prop.permit, status: 'nodata', kept: 0, removed: 0, days: 0, maxDays: Math.floor(period.totalDays / 2) });
      continue;
    }

    let kept = clipped, removed = [];
    if (reduce) {
      const res = applyHalfRule(clipped, period.totalDays);
      kept = res.kept;
      removed = res.removed;
    }

    const occupiedDays = getOccupiedDates(kept).length;
    const csvBytes = buildCSVBytes(prop.permit, periodId, kept);
    const filename = `${prop.name}_${periodId}.csv`;
    zip.file(filename, csvBytes);

    // レポートCSV
    const allForProp = bookingData.filter(b =>
      String(b.propertyName ?? '').toLowerCase().includes(prop.keyword));
    const keptRawRowsProp = new Set(kept.map(b => b._rawRow));
    zip.file(`${prop.name}_${periodId}_レポート.csv`,
      buildReportCSV(allForProp, keptRawRowsProp, period));

    results.push({
      label: prop.name, permit: prop.permit, status: removed.length > 0 ? 'reduced' : 'ok',
      kept: kept.length, removed: removed.length,
      days: occupiedDays, maxDays: Math.floor(period.totalDays / 2)
    });
  }

  // ZIP生成
  generatedZipBlob = await zip.generateAsync({ type: 'blob' });

  // 結果表示
  showResults(results, periodId, reduce, period.totalDays);
}

function showResults(results, periodId, reduced, totalDays) {
  const card = document.getElementById('resultCard');
  const header = document.getElementById('resultHeader');
  const sub = document.getElementById('resultSub');
  const list = document.getElementById('resultList');
  const notice = document.getElementById('resultNotice');

  const generated = results.filter(r => r.status !== 'nodata');
  header.textContent = `${generated.length} 件のCSVを生成しました`;
  sub.textContent = `報告期間: ${periodId}　期間日数: ${totalDays}日　上限: ${Math.floor(totalDays/2)}日`;

  list.innerHTML = '';
  for (const r of results) {
    const el = document.createElement('div');
    el.className = 'result-item';

    let tagHtml, statsHtml;
    if (r.status === 'nodata') {
      tagHtml  = '<span class="ri-tag nodata">予約なし</span>';
      statsHtml = '<span style="color:#ccc">—</span>';
    } else if (r.status === 'reduced') {
      tagHtml  = `<span class="ri-tag reduced">削除: ${r.removed}件</span>`;
      statsHtml = `宿泊日数 ${r.days}日 / ${r.kept}予約`;
    } else {
      tagHtml  = '<span class="ri-tag ok">OK</span>';
      statsHtml = `宿泊日数 ${r.days}日 / ${r.kept}予約`;
    }

    el.innerHTML = `
      <div class="ri-room">${r.label}</div>
      <div class="ri-stats">${statsHtml}</div>
      ${tagHtml}
    `;
    list.appendChild(el);
  }

  const reducedRooms = results.filter(r => r.status === 'reduced');
  notice.textContent = reducedRooms.length > 0
    ? `※ ${reducedRooms.length}室で予約を除外しました。除外した予約はCSVに含まれていません。`
    : '';

  card.classList.add('show');
}

function downloadZip() {
  if (!generatedZipBlob) return;
  const year = document.getElementById('yearInput').value;
  const period = document.getElementById('periodSelect').value;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(generatedZipBlob);
  a.download = `宿泊実績_${year}_${period}.zip`;
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
