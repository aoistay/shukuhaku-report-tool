<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神楽坂belle ville 宿泊実績手動入力</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
  background: #f0f2f5;
  color: #333;
  min-height: 100vh;
}
.container { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
h1 { font-size: 1.3rem; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
.subtitle { font-size: .85rem; color: #888; margin-bottom: 22px; }

.card {
  background: white;
  border-radius: 10px;
  padding: 20px 22px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.card-title {
  font-size: .78rem;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.step-badge {
  background: #4361ee;
  color: white;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: .7rem;
  font-weight: 700;
  flex-shrink: 0;
}

.row { display: flex; gap: 14px; }
.field { flex: 1; }
.field label { display: block; font-size: .82rem; color: #666; margin-bottom: 5px; }
.field input, .field select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #dde1ed;
  border-radius: 6px;
  font-size: .9rem;
  font-family: inherit;
  background: #fafbff;
}
.field input:focus, .field select:focus {
  outline: none; border-color: #4361ee;
}

/* ── リスティングセクション ── */
.listing-block {
  border: 1px solid #e8eaf0;
  border-radius: 8px;
  margin-bottom: 14px;
  overflow: hidden;
}
.listing-block:last-child { margin-bottom: 0; }

.listing-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  background: #f8f9ff;
  border-bottom: 1px solid #e8eaf0;
  flex-wrap: wrap;
}
.listing-name {
  font-size: 1rem;
  font-weight: 700;
  color: #1a1a2e;
  min-width: 90px;
}
.listing-name.plus { color: #c9184a; }

.permit-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .82rem;
  color: #666;
}
.permit-input {
  width: 140px;
  padding: 5px 8px;
  border: 1px solid #dde1ed;
  border-radius: 5px;
  font-size: .82rem;
  font-family: 'Courier New', monospace;
  background: white;
}

.listing-body { padding: 14px 16px; }

/* ── 予約テーブル ── */
.booking-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 10px;
  font-size: .84rem;
}
.booking-table th {
  background: #f0f2f5;
  padding: 7px 8px;
  text-align: left;
  font-size: .75rem;
  color: #666;
  font-weight: 600;
  border-bottom: 1px solid #e0e3ea;
}
.booking-table td {
  padding: 5px 6px;
  border-bottom: 1px solid #f5f5f5;
  vertical-align: middle;
}
.booking-table tr:last-child td { border-bottom: none; }
.booking-table tr:hover td { background: #fafafa; }

.td-date input {
  width: 130px;
  padding: 5px 7px;
  border: 1px solid #dde1ed;
  border-radius: 5px;
  font-size: .84rem;
  font-family: inherit;
}
.td-guests input {
  width: 60px;
  padding: 5px 7px;
  border: 1px solid #dde1ed;
  border-radius: 5px;
  font-size: .84rem;
  text-align: center;
  font-family: inherit;
}
.td-nat select {
  padding: 5px 7px;
  border: 1px solid #dde1ed;
  border-radius: 5px;
  font-size: .82rem;
  font-family: inherit;
  background: white;
  min-width: 100px;
}
.td-del button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  color: #ccc;
  padding: 2px 5px;
  border-radius: 4px;
  transition: color .15s;
}
.td-del button:hover { color: #e63946; }

.btn-add-row {
  background: none;
  border: 1px dashed #b0b8d8;
  color: #4361ee;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: .82rem;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.btn-add-row:hover { border-color: #4361ee; background: #f0f4ff; }

.listing-empty {
  color: #bbb;
  font-size: .82rem;
  padding: 6px 0;
  font-style: italic;
}

/* ── グループ区切り ── */
.group-label {
  font-size: .78rem;
  font-weight: 700;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin: 18px 0 8px;
}
.group-label:first-child { margin-top: 0; }

/* ── ボタン ── */
.btn-generate {
  width: 100%;
  padding: 14px;
  background: #4361ee;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background .2s;
  letter-spacing: .02em;
  margin-top: 6px;
}
.btn-generate:hover { background: #3451d1; }
.btn-generate:active { transform: scale(.99); }

.result-card {
  display: none;
  background: white;
  border-radius: 10px;
  padding: 20px 22px;
  margin-top: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.result-card.show { display: block; }
.result-header { font-size: .95rem; font-weight: 700; margin-bottom: 12px; color: #1a1a2e; }
.result-list {
  max-height: 300px; overflow-y: auto;
  border: 1px solid #eee; border-radius: 6px;
}
.result-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 12px; border-bottom: 1px solid #f5f5f5; font-size: .83rem;
}
.result-item:last-child { border-bottom: none; }
.result-item:nth-child(even) { background: #fafafa; }
.ri-room { font-weight: 600; min-width: 90px; }
.ri-stats { color: #666; flex: 1; padding: 0 12px; }
.ri-tag {
  font-size: .72rem; padding: 2px 7px; border-radius: 20px;
  font-weight: 600; white-space: nowrap;
}
.ri-tag.ok { background: #d4f4e8; color: #0a7a4e; }
.ri-tag.zero { background: #f0f0f0; color: #999; }

.btn-download {
  display: block; width: 100%; padding: 12px;
  background: #2ec4b6; color: white; border: none;
  border-radius: 8px; font-size: .95rem; font-weight: 700;
  cursor: pointer; margin-top: 14px; font-family: inherit;
  transition: background .2s;
}
.btn-download:hover { background: #21a99d; }
.notice {
  font-size: .78rem; color: #999; text-align: center;
  margin-top: 10px; line-height: 1.6;
}
.error-msg { color: #e63946; font-size: .83rem; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>🏡 神楽坂belle ville 宿泊実績手動入力</h1>
  <div class="subtitle">各リスティングの予約を手動で入力 → 民泊届出用 CSV（Shift-JIS）を生成します</div>

  <!-- Step 1: 報告期間 -->
  <div class="card">
    <div class="card-title"><span class="step-badge">1</span>報告期間を設定</div>
    <div class="row">
      <div class="field">
        <label>対象年（1ヶ月目の年）</label>
        <input type="number" id="yearInput" value="2026" min="2020" max="2040">
      </div>
      <div class="field">
        <label>報告期間</label>
        <select id="periodSelect">
          <option value="4-5">4月〜5月</option>
          <option value="6-7" selected>6月〜7月</option>
          <option value="8-9">8月〜9月</option>
          <option value="10-11">10月〜11月</option>
          <option value="12-1">12月〜1月</option>
          <option value="2-3">2月〜3月</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Step 2: 予約入力 -->
  <div class="card">
    <div class="card-title"><span class="step-badge">2</span>各リスティングの予約を入力</div>
    <div id="listingsContainer"></div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <button class="btn-generate" onclick="generate()">CSV を生成する</button>

  <!-- 結果 -->
  <div class="result-card" id="resultCard">
    <div class="result-header" id="resultHeader"></div>
    <div class="result-list" id="resultList"></div>
    <button class="btn-download" onclick="downloadZip()">⬇️ ZIP をダウンロード</button>
    <div class="notice">全10リスティング分のCSVが含まれます（予約なしは0件CSVとして出力）</div>
  </div>
</div>

<script>
// =====================================================================
// リスティング定義
// =====================================================================
const LISTINGS = [
  { id: 'A',  name: '神楽坂A',  permit: 'M130039686', plus: false },
  { id: 'Ap', name: '神楽坂A+', permit: 'M130039688', plus: true  },
  { id: 'B',  name: '神楽坂B',  permit: 'M130039687', plus: false },
  { id: 'Bp', name: '神楽坂B+', permit: 'M130039689', plus: true  },
  { id: 'C',  name: '神楽坂C',  permit: 'M130039690', plus: false },
  { id: 'Cp', name: '神楽坂C+', permit: 'M130039691', plus: true  },
  { id: 'D',  name: '神楽坂D',  permit: 'M130039693', plus: false },
  { id: 'Dp', name: '神楽坂D+', permit: 'M130039694', plus: true  },
  { id: 'E',  name: '神楽坂E',  permit: 'M130039696', plus: false },
  { id: 'Ep', name: '神楽坂E+', permit: 'M130039716', plus: true  },
];

// 国籍リスト
const NAT_COLS = [
  '日本','韓国','台湾','香港','中国','タイ','シンガポール','マレーシア',
  'インドネシア','フィリピン','ベトナム','インド','英国','ドイツ',
  'フランス','イタリア','スペイン','ロシア','米国','カナダ','オーストラリア','その他'
];

// CSVヘッダー（Shift-JIS固定バイト列）
const HEADER_SJIS = new Uint8Array([
  147,205,143,111,148,212,141,134,44,149,241,141,144,138,250,138,212,44,
  143,104,148,145,147,250,144,148,44,143,104,148,145,142,210,144,148,44,
  137,132,130,215,144,108,144,148,44,147,250,150,123,44,138,216,141,145,44,
  145,228,152,112,44,141,129,141,96,44,146,134,141,145,44,131,94,131,67,44,
  131,86,131,147,131,75,131,124,129,91,131,139,44,131,125,131,140,129,91,
  131,86,131,65,44,131,67,131,147,131,104,131,108,131,86,131,65,44,131,116,
  131,66,131,138,131,115,131,147,44,131,120,131,103,131,105,131,128,44,
  131,67,131,147,131,104,44,137,112,141,145,44,131,104,131,67,131,99,44,
  131,116,131,137,131,147,131,88,44,131,67,131,94,131,138,131,65,44,131,88,
  131,121,131,67,131,147,44,131,141,131,86,131,65,44,149,196,141,145,44,
  131,74,131,105,131,95,44,131,73,129,91,131,88,131,103,131,137,131,138,
  131,65,44,130,187,130,204,145,188,44,143,104,148,145,147,250
]);

// =====================================================================
// UI 構築
// =====================================================================
let rowCounters = {}; // listingId → 行番号カウンター

function buildUI() {
  const container = document.getElementById('listingsContainer');
  container.innerHTML = '';

  const natOptions = NAT_COLS.map(n =>
    `<option value="${n}"${n === 'その他' ? ' selected' : ''}>${n}</option>`
  ).join('');

  LISTINGS.forEach((l, idx) => {
    // グループラベル（A/A+ の前と B/B+ など、ペアの最初）
    if (idx % 2 === 0) {
      const unit = l.name.replace('神楽坂', '').replace('+', '');
      const label = document.createElement('div');
      label.className = 'group-label';
      label.textContent = `ユニット ${unit}`;
      container.appendChild(label);
    }

    rowCounters[l.id] = 0;

    const block = document.createElement('div');
    block.className = 'listing-block';
    block.id = `block_${l.id}`;

    block.innerHTML = `
      <div class="listing-header">
        <span class="listing-name${l.plus ? ' plus' : ''}">${l.name}</span>
        <div class="permit-wrap">
          <span>届出番号:</span>
          <input class="permit-input" id="permit_${l.id}" value="${l.permit}" placeholder="M130000000">
        </div>
      </div>
      <div class="listing-body">
        <table class="booking-table">
          <thead>
            <tr>
              <th>チェックイン</th>
              <th>チェックアウト</th>
              <th>ゲスト数</th>
              <th>国籍</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody_${l.id}"></tbody>
        </table>
        <button class="btn-add-row" onclick="addRow('${l.id}')">＋ 予約を追加</button>
      </div>
    `;
    container.appendChild(block);
  });
}

function addRow(listingId) {
  const tbody = document.getElementById(`tbody_${listingId}`);
  const rowId = `${listingId}_${++rowCounters[listingId]}`;

  // デフォルトの日付（報告期間の最初の月1日）
  const year = document.getElementById('yearInput').value || '2026';
  const [startMonth] = document.getElementById('periodSelect').value.split('-');
  const defaultCi = `${year}-${String(startMonth).padStart(2,'0')}-01`;
  const defaultCo = `${year}-${String(startMonth).padStart(2,'0')}-02`;

  const natOptions = NAT_COLS.map(n =>
    `<option value="${n}"${n === 'その他' ? ' selected' : ''}>${n}</option>`
  ).join('');

  const tr = document.createElement('tr');
  tr.id = `row_${rowId}`;
  tr.innerHTML = `
    <td class="td-date"><input type="date" id="ci_${rowId}" value="${defaultCi}"></td>
    <td class="td-date"><input type="date" id="co_${rowId}" value="${defaultCo}"></td>
    <td class="td-guests"><input type="number" id="guests_${rowId}" value="1" min="1" max="99"></td>
    <td class="td-nat"><select id="nat_${rowId}">${natOptions}</select></td>
    <td class="td-del"><button onclick="removeRow('${rowId}')" title="削除">🗑</button></td>
  `;
  tbody.appendChild(tr);
}

function removeRow(rowId) {
  const row = document.getElementById(`row_${rowId}`);
  if (row) row.remove();
}

// =====================================================================
// 日付ユーティリティ
// =====================================================================
function parseInputDate(val) {
  if (!val) return null;
  const m = val.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}

function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}

function dateStr(d) {
  const y = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}/${mm}/${dd}`;
}

function getPeriod(year, periodStr) {
  const [s, e] = periodStr.split('-').map(Number);
  const startDate = new Date(year, s - 1, 1);
  const endYear   = e < s ? year + 1 : year;
  const endDate   = new Date(endYear, e, 0);
  const totalDays = Math.round((endDate - startDate) / 86400000) + 1;
  return { startDate, endDate, totalDays };
}

// =====================================================================
// 集計ロジック
// =====================================================================
function processBookings(rawBookings, period) {
  const { startDate, endDate } = period;
  const dayAfterEnd = addDays(endDate, 1);
  const result = [];

  for (const b of rawBookings) {
    if (b.checkout <= startDate) continue;
    if (b.checkin >= dayAfterEnd) continue;

    const effStart  = b.checkin < startDate ? startDate : b.checkin;
    const effEnd    = b.checkout > dayAfterEnd ? dayAfterEnd : b.checkout;
    const effNights = Math.round((effEnd - effStart) / 86400000);
    if (effNights <= 0) continue;

    result.push({ ...b, effStart, effEnd, effNights });
  }
  return result;
}

function getOccupiedDates(bookings) {
  const set = new Set();
  for (const b of bookings) {
    for (let d = new Date(b.effStart); d < b.effEnd; d = addDays(d, 1)) {
      set.add(dateStr(d));
    }
  }
  return [...set].sort();
}

// =====================================================================
// CSV生成（Shift-JIS）
// =====================================================================
function buildCSVBytes(permitNum, periodId, bookings) {
  const dates      = getOccupiedDates(bookings);
  const stayDays   = dates.length;
  const guestCount = bookings.reduce((s, b) => s + b.guests, 0);
  const totalPN    = bookings.reduce((s, b) => s + b.effNights * b.guests, 0);

  // 国籍集計
  const natCount = {};
  NAT_COLS.forEach(n => natCount[n] = 0);
  for (const b of bookings) {
    const n = b.nationality || 'その他';
    natCount[n] = (natCount[n] || 0) + b.guests;
  }

  const dataValues = [
    permitNum, periodId, stayDays, guestCount, Math.round(totalPN),
    ...NAT_COLS.map(n => natCount[n] || 0),
    ...dates
  ];
  const dataRow = dataValues.join(',');

  const trailingCommas = ','.repeat(dates.length);
  const headerTrailing = (trailingCommas + '\r\n').split('').map(c => c.charCodeAt(0));
  const dataBytes      = (dataRow + '\r\n').split('').map(c => c.charCodeAt(0));

  const total = HEADER_SJIS.length + headerTrailing.length + dataBytes.length;
  const buf   = new Uint8Array(total);
  let pos = 0;
  buf.set(HEADER_SJIS, pos); pos += HEADER_SJIS.length;
  buf.set(headerTrailing, pos); pos += headerTrailing.length;
  buf.set(dataBytes, pos);
  return buf;
}

// =====================================================================
// メイン処理
// =====================================================================
let generatedZipBlob = null;

async function generate() {
  const errorEl = document.getElementById('errorMsg');
  errorEl.textContent = '';

  const year      = parseInt(document.getElementById('yearInput').value);
  const periodStr = document.getElementById('periodSelect').value;
  if (!year || isNaN(year)) {
    errorEl.textContent = '年を正しく入力してください。';
    return;
  }

  const period   = getPeriod(year, periodStr);
  const periodId = `${year}_${periodStr}`;

  const zip     = new JSZip();
  const results = [];

  for (const l of LISTINGS) {
    const permit = (document.getElementById(`permit_${l.id}`)?.value || l.permit).trim();

    // 行データを収集
    const tbody = document.getElementById(`tbody_${l.id}`);
    const rawBookings = [];

    for (const tr of tbody.querySelectorAll('tr')) {
      const rowId = tr.id.replace('row_', '');
      const ciEl     = document.getElementById(`ci_${rowId}`);
      const coEl     = document.getElementById(`co_${rowId}`);
      const guestsEl = document.getElementById(`guests_${rowId}`);
      const natEl    = document.getElementById(`nat_${rowId}`);

      if (!ciEl || !coEl) continue;

      const checkin  = parseInputDate(ciEl.value);
      const checkout = parseInputDate(coEl.value);
      const guests   = parseInt(guestsEl?.value) || 1;
      const nat      = natEl?.value || 'その他';

      if (!checkin || !checkout) continue;
      if (checkout <= checkin) continue;

      rawBookings.push({ checkin, checkout, guests, nationality: nat });
    }

    // 期間内にクリップ
    const clipped = processBookings(rawBookings, period);

    // ゼロでもCSVを出力（神楽坂は0件でも報告義務あり）
    const csvBytes = buildCSVBytes(permit, periodId, clipped);
    zip.file(`${l.name}_${periodId}.csv`, csvBytes);

    const days = getOccupiedDates(clipped).length;
    results.push({
      name: l.name,
      permit,
      bookings: clipped.length,
      days,
      guests: clipped.reduce((s, b) => s + b.guests, 0),
    });
  }

  generatedZipBlob = await zip.generateAsync({ type: 'blob' });
  showResults(results, periodId);
}

function showResults(results, periodId) {
  const card   = document.getElementById('resultCard');
  const header = document.getElementById('resultHeader');
  const list   = document.getElementById('resultList');

  const withData = results.filter(r => r.bookings > 0);
  header.textContent = `${withData.length} リスティングに予約あり（全10件のCSVを生成）`;

  list.innerHTML = '';
  for (const r of results) {
    const el = document.createElement('div');
    el.className = 'result-item';

    const hasData = r.bookings > 0;
    const tag = hasData
      ? `<span class="ri-tag ok">宿泊日数 ${r.days}日</span>`
      : `<span class="ri-tag zero">予約なし（0件CSV）</span>`;
    const stats = hasData
      ? `${r.bookings}予約 / ゲスト計${r.guests}人`
      : '—';

    el.innerHTML = `
      <div class="ri-room">${r.name}</div>
      <div class="ri-stats" style="font-size:.78rem;color:#888">${r.permit} &nbsp; ${stats}</div>
      ${tag}
    `;
    list.appendChild(el);
  }

  card.classList.add('show');
}

function downloadZip() {
  if (!generatedZipBlob) return;
  const year   = document.getElementById('yearInput').value;
  const period = document.getElementById('periodSelect').value;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(generatedZipBlob);
  a.download = `神楽坂belle ville_${year}_${period}.zip`;
  a.click();
  URL.revokeObjectURL(a.href);
}
